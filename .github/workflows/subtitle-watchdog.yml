name: subtitle-watchdog
# Volf/Zoloth 字幕管線追蹤到癒（2h 一次，結案後每輪秒退）
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: subtitle-watchdog
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - name: watch
        run: python jobs/subtitle_watchdog.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
      - name: commit state
        if: always()
        run: |
          git config user.name "watch-bot"
          git config user.email "b921603@users.noreply.github.com"
          git add trail/sub_watch.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "sub-watch: state [skip ci]"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) || true
          fi
