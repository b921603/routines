name: patrol

on:
  schedule:
    - cron: "30 21 * * *"   # 05:30 台北 · 每日影子巡邏（錯峰於所有寫入窗口）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: patrol (read-only)
        run: python podcast/patrol.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          PODCAST_CID: ${{ secrets.PODCAST_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
      - name: gate
        run: python podcast/gate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: keep
        if: always()
        run: |
          git config user.name "b921603"
          git config user.email "b921603@users.noreply.github.com"
          # 只提交 patrol 自己的狀態檔——upload_slots.json（槽位統御運行時檔）絕不掃（11-25 衝突污染教訓）
          git add state/patrol-state.json state/gate-state.json state/gate-decision.md state/gate-llm-trace.json state/pit-work-order.json
          git diff --cached --quiet || git commit -m "patrol state"
          if (git pull --rebase origin main) { git push origin main } else {
            git rebase --abort 2>$null
            Write-Output "rebase conflict — skip push (retry next patrol)"
          }
