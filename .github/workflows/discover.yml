name: sweep

on:
  schedule:
    - cron: "10 13 * * 0"   # weekly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x86
      - name: run
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_CLICK: ${{ secrets.NTFY_CLICK }}
          SHAPE_VIP: ${{ secrets.SHAPE_VIP }}
          SHAPE_FIRST: ${{ secrets.SHAPE_FIRST }}
          SHAPE_LAUNCH: ${{ secrets.SHAPE_LAUNCH }}
          SHAPE_CAMP: ${{ secrets.SHAPE_CAMP }}
          SHAPE_DEV: ${{ secrets.SHAPE_DEV }}
        shell: pwsh
        run: node jobs/discover.cjs
      - name: keep
        if: always()
        shell: pwsh
        run: |
          git config user.name "b921603"
          git config user.email "b921603@users.noreply.github.com"
          # 只提交 sweep 產物——upload_slots.json 是運行時協調檔（槽位統御），絕不整包掃（11-25 衝突污染教訓）
          git add state/candidates.json state/discovery-*.json logs
          git diff --cached --quiet || git commit -m "state sync"
          if (git pull --rebase origin main) { git push } else {
            git rebase --abort 2>$null
            Write-Output "rebase conflict — skip push this round (retry next sweep)"
          }
