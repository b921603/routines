name: ob-redesc
# 未顯示 4 集簡介敏感詞改寫（用戶授權延伸）——一次性，用後即刪。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redesc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - name: rewrite flagged descriptions (title/audio/subs untouched)
        run: python jobs/ob_redesc.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
