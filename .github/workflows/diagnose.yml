name: check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x86
      - name: run
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
        shell: pwsh
        run: node jobs/diagnose.cjs
