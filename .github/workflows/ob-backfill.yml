name: ob-backfill

on:
  schedule:
    # 11-26 用戶裁定「敢死隊式補齊」：drain 每 3h 一班（8 班/日×12 集=96/日 → 986 集 ~10 天補完）
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ob-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow pyyaml
      - name: import smoke test (pyflakes + entrypoints)
        env:
          SVC_USER: smoke
          SVC_PASS: smoke
        run: |
          python3 -m pip install pyflakes -q
          if python3 -m pyflakes podcast/ob_update.py | grep -q "undefined name"; then
            python3 -m pyflakes podcast/ob_update.py | grep "undefined name"
            echo "undefined name(s) found — defused pre-run"
            exit 1
          fi
          echo "pyflakes OK"
          python3 -c "
          import sys; sys.path.insert(0, 'podcast')
          import ob_update
          assert callable(ob_update.main) and callable(ob_update.emit_pit)
          print('smoke OK')"
      - name: preflight (six-iteration scar regression; deploy-gating)
        env:
          SVC_USER: smoke
          SVC_PASS: smoke
        run: python podcast/preflight.py
      - name: backfill (oldest-first drain)
        run: python podcast/ob_update.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          OB_BACKFILL: "1"
          OB_BACKFILL_MAX: "12"
      - name: commit trail (channel+ledger+pit)
        if: always()
        run: |
          git config user.name "ob-bot"
          git config user.email "b921603@users.noreply.github.com"
          git add trail/ \
                  trail/ob_channels.json trail/ob_binds.json trail/ob_parts.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ob trail: run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) \
              || echo "trail push deferred (race)"
          fi
      - name: triage+notify on failure (six-step SOP, 11-27 runbook)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TRIAGE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 jobs/triage.py
          git config user.name "triage-bot"
          git config user.email "b921603@users.noreply.github.com"
          git add trail/triage 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "triage: run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) || true
          fi
