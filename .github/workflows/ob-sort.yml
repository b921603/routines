name: ob-sort

on:
  workflow_dispatch:
    inputs:
      asc:
        description: "舊→新（播出順序）？留空=最新→最舊（預設）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ob-sort
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow pyyaml
      - name: sort channels by episode date (drag-order, user 11-27)
        run: python jobs/ob_sort.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          OB_SORT_DESC: "${{ github.event.inputs.asc == '1' && '0' || '1' }}"
      - name: commit trail
        if: always()
        run: |
          git config user.name "ob-bot"
          git config user.email "b921603@users.noreply.github.com"
          git add trail/ob_sort.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ob sort trail [skip ci]"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) || true
          fi
