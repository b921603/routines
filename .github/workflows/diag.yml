name: diag-fleet
# 唯讀盤點（頻道/分組）——用後即刪的臨時診斷 workflow。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-fleet

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - name: fleet diag (read-only)
        run: python jobs/diag_fleet.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
