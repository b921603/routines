name: ob-retitle
# 「未顯示」4 集標題改寫（2026-11-27 用戶核准）——一次性，用後即刪。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retitle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - name: retitle 4 hidden episodes (title-only, lrc preserved)
        run: python jobs/ob_retitle.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
