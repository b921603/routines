name: diag-display
# 「未顯示」偵查（唯讀）——用後即刪。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - name: display-state diag
        run: python jobs/diag_display.py
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
