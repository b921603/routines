name: ob-daily

on:
  schedule:
    - cron: "45 14 * * *"   # 22:45 台北 · On Being 日更（新集 4 天窗）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ob-daily
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow pyyaml
      - name: import smoke test (pyflakes + entrypoints)
        env:
          SVC_USER: smoke
          SVC_PASS: smoke
        run: |
          python3 -m pip install pyflakes -q
          if python3 -m pyflakes podcast/ob_update.py | grep -q "undefined name"; then
            python3 -m pyflakes podcast/ob_update.py | grep "undefined name"
            echo "undefined name(s) found — defused pre-run"
            exit 1
          fi
          echo "pyflakes OK"
          python3 -c "
          import sys; sys.path.insert(0, 'podcast')
          import ob_update
          assert callable(ob_update.main) and callable(ob_update.emit_pit)
          print('smoke OK')"
      - name: preflight (six-iteration scar regression; deploy-gating)
        env:
          SVC_USER: smoke
          SVC_PASS: smoke
        run: python podcast/preflight.py
      - name: daily (new episodes)
        run: python podcast/ob_update.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          PODCAST_COOKIE: ${{ secrets.PODCAST_COOKIE }}
          OB_CID: ${{ secrets.OB_CID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
      - name: commit trail (channel+ledger+pit)
        if: always()
        run: |
          git config user.name "ob-bot"
          git config user.email "b921603@users.noreply.github.com"
          git add trail/ob_channel.json trail/done_ob.json trail/ob-pit.json \
                  trail/ob_channels.json trail/ob_binds.json trail/ob_parts.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ob daily trail: run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main && git push) \
              || echo "trail push deferred (race)"
          fi
      - name: notify on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, requests, os
          msg = {"topic": os.environ["NTFY_URL"], "title": "On Being daily failed",
                 "priority": 4, "tags": ["rotating_light"],
                 "message": f"ob-backfill run {os.environ.get('RUN_ID','?')} 失敗——查 log。"}
          requests.post("https://ntfy.sh/", data=json.dumps(msg), timeout=20)
          PY
