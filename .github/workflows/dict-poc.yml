name: dict-poc

on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x86
      - name: poc (read-only)
        run: node jobs/dict_diagnose.cjs
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          SHAPE_VIP: ${{ secrets.SHAPE_VIP }}
          SHAPE_FIRST: ${{ secrets.SHAPE_FIRST }}
          SHAPE_LAUNCH: ${{ secrets.SHAPE_LAUNCH }}
          SHAPE_CAMP: ${{ secrets.SHAPE_CAMP }}
      - name: poc (post checkin)
        if: always()
        run: node jobs/dict_diagnose.cjs
        env:
          SVC_USER: ${{ secrets.SVC_USER }}
          SVC_PASS: ${{ secrets.SVC_PASS }}
          SHAPE_VIP: ${{ secrets.SHAPE_VIP }}
          SHAPE_FIRST: ${{ secrets.SHAPE_FIRST }}
          SHAPE_LAUNCH: ${{ secrets.SHAPE_LAUNCH }}
          SHAPE_CAMP: ${{ secrets.SHAPE_CAMP }}
          DICT_POST: "1"
